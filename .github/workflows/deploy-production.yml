name: Deploy Vultr production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-vultr-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified master commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: vps-production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build, back up, migrate, and restart
        id: deployment
        run: |
          case "$VPS_APP_DIR" in
            /*) ;;
            *) echo "VPS_APP_DIR must be an absolute path" >&2; exit 1 ;;
          esac
          if [[ "$VPS_APP_DIR" == *"'"* || "$VPS_APP_DIR" == *$'\n'* || "$VPS_APP_DIR" == *$'\r'* ]]; then
            echo "VPS_APP_DIR contains unsupported characters" >&2
            exit 1
          fi
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid deploy SHA" >&2; exit 1; }
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$VPS_APP_DIR' '$DEPLOY_SHA'" < scripts/deploy.sh

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Vultr production deployment"
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- Target: \`${VPS_HOST}\`"
            echo "- Deployment step: ${{ steps.deployment.outcome }}"
            echo "- Job result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
